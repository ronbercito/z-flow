services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Lima}
      MARIADB_DATABASE: ${DB_NAME:-zflow}
      MARIADB_USER: ${DB_USER:-zflow}
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Z-FLOW}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env before starting Z-FLOW}"
    volumes:
      - zflow_db:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Lima}
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zflow}
      DB_USER: ${DB_USER:-zflow}
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Z-FLOW}"
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Lima}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zflow_db:
