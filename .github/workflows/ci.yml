name: Z-FLOW CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      # Throwaway values for Compose interpolation in CI only.
      DB_PASSWORD: ci-only-not-a-secret
      DB_ROOT_PASSWORD: ci-only-root-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
